<!doctype html>
<html lang="{{ page.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    document.documentElement.classList.add('is-loading');
    // Page transitions (see main.css): the first wheel, touch or key on the
    // new page ends the transition at once, so the header responds. Plain
    // scroll events are left out: the browser can fire one on its own as the
    // page appears, which would cut the transition short for no reason.
    // This has to be here, before the page first renders, to catch the event.
    window.addEventListener('pagereveal', (event) => {
      const transition = event.viewTransition;
      if (!transition) return;
      // Skipping rejects the transition's promises; that's expected.
      ['ready', 'finished', 'updateCallbackDone'].forEach((k) => transition[k] && transition[k].catch(() => {}));
      const finish = () => transition.skipTransition();
      ['wheel', 'touchmove', 'keydown'].forEach((type) => window.addEventListener(type, finish, { once: true, passive: true }));
    });
    // The page being left gets the same transition; a skip rejects it too.
    window.addEventListener('pageswap', (event) => {
      const t = event.viewTransition;
      if (t) ['ready', 'finished', 'updateCallbackDone'].forEach((k) => t[k] && t[k].catch(() => {}));
    });
  </script>
  {% seo %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,600&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  {% feed_meta %}
</head>
<body>
  <div class="site">
    {% include header.html %}
    <main id="content">
      {{ content }}
    </main>
  </div>
  {% include footer.html %}
  <script src="{{ '/assets/js/header.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/lib/motion-14.4.0.min.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/bounce.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/footer.js' | relative_url }}" defer></script>
</body>
</html>
