<!doctype html>
<html lang="{{ page.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>document.documentElement.classList.add('is-loading')</script>
  {% seo %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  {% feed_meta %}
</head>
<body>
  <div class="site">
    {% include header.html %}
    <main id="content">
      {{ content }}
    </main>
  </div>
  {% include footer.html %}
  <script src="{{ '/assets/js/header.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/lib/motion-14.4.0.min.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/bounce.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/footer.js' | relative_url }}" defer></script>
</body>
</html>
