---
layout: default
---
<article class="page post">
  <header class="post__header">
    <h1 class="page__title">{{ page.title }}</h1>
    {%- if page.subtitle %}
    <p class="post__subtitle">{{ page.subtitle }}</p>
    {%- endif %}
    <p class="post__date"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%B %-d, %Y' }}</time></p>
  </header>
  <div class="prose">
    {{ content }}
  </div>
</article>
