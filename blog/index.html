---
layout: page
title: Blog
---
{% if site.posts.size > 0 %}
<ul class="post-list">
  {% for post in site.posts %}
  <li>
    <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
    <span class="post-list__date">{{ post.date | date: '%B %-d, %Y' }}</span>
  </li>
  {% endfor %}
</ul>
{% else %}
<p>First posts coming soon.</p>
{% endif %}
